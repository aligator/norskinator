# Static hosting for the built PWA. Included in nginx's http context.

# Hashed bundles never change; everything else must be revalidated so a new
# image (index.html, sw.js, manifest) reaches the browser on the next visit.
map $uri $norskinator_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # TLS ends at the reverse proxy; absolute redirects would point to http://…:8080.
  absolute_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Headers live at server level: an add_header inside a location would drop all of these there.
  add_header Cache-Control $norskinator_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Lit sets inline style attributes, hence 'unsafe-inline' for styles only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  # Written at start by 40-basic-auth.sh: either "auth_basic off" or the login settings.
  include /tmp/norskinator-auth.conf;

  location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Install metadata stays public, otherwise the browser cannot offer "install app" behind a login.
  location ~ ^/(favicon\.svg|apple-touch-icon\.png|icon-[a-z0-9-]+\.png)$ {
    auth_basic off;
    try_files $uri =404;
  }

  # The browser's background update check for the service worker sends no
  # Basic credentials; behind the login it gets a 401 and the old worker stays
  # installed forever. Both files only list asset URLs, the assets stay private.
  location ~ ^/(sw\.js|workbox-[a-z0-9]+\.js)$ {
    auth_basic off;
    try_files $uri =404;
  }

  # nginx's stock mime.types has no entry for .webmanifest.
  location ~ \.webmanifest$ {
    auth_basic off;
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location / {
    # Hash routing: every route is index.html at "/", so unknown paths are real 404s.
    try_files $uri $uri/ =404;
  }
}
