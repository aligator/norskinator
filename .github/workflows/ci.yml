name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify

  image-github:
    name: Docker image (GitHub)
    if: github.server_url == 'https://github.com'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests only prove the image builds; main and tags publish it.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # Tag builds show the tag (v1.0.1), everything else main-<short sha>.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/norskinator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # amd64 only: the runner cannot emulate arm64.
  # Needs secrets REGISTRY_USER and REGISTRY_TOKEN (`write:package`).
  # Tags publish the release; pull requests publish the image their Argo
  # preview deploys (aligator/gitops, applicationsets/norskinator.yaml).
  image-forgejo:
    name: Docker image (Forgejo)
    if: github.server_url != 'https://github.com' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request')
    needs: verify
    runs-on: docker
    # The default image has no Docker CLI new enough for the daemon.
    container:
      image: docker:29.9.0-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
    steps:
      - run: apk add --no-cache nodejs git

      - id: registry
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"

      # Must match the preview's pr-{{.number}}-{{.head_short_sha}}, the first
      # 8 characters of the PR head. Tags get their version as APP_VERSION.
      - id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "value=pr-${PR_NUMBER}-$(echo "$PR_HEAD_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          else
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # The PR head, not a merge commit: the tag names the head's SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository }}
          # release-sha-<sha7> is what the cluster deploys: Argo follows the
          # protected `release` branch and pins this tag for its head commit
          # (aligator/gitops, applicationsets/norskinator.yaml). Only tag runs
          # build it, so an untagged commit on `release` has no image.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=release-sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.event_name == 'pull_request' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The docker driver cannot produce provenance attestations.
          provenance: false
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            APP_VERSION=${{ steps.version.outputs.value }}
